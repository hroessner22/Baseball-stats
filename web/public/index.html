<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1220">
    <meta name="description" content="DIAMOND:CONTEXT — every MLB game in progress, each led by an empirical win probability drawn from 150 years of history.">
    <title>DIAMOND:CONTEXT — Live Baseball Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter Variable — any weight 100-900 renders cleanly so the
         mid-weights (550, 650) we use to dial back the boldness
         actually exist rather than silently rounding to the nearest
         discrete weight. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260616LOGO">
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=2">
</head>
<body>
    <header>
        <a class="brand" href="#live" aria-label="DIAMOND:CONTEXT home">
            <!-- Brand mark: the diamond + baseball logo. Inline so it renders
                 without an extra request; fixed brand colors (works on any bg). -->
            <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
                <path d="M50 5 L95 50 L50 95 L5 50 Z" fill="#3E8E54"/>
                <path d="M50 28 L72 50 L50 72 L28 50 Z" fill="none"
                      stroke="#C9A06A" stroke-width="4" stroke-linejoin="round"/>
                <g fill="#F4F4F0">
                    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" rx="1.2" transform="translate(72 50) rotate(45)"/>
                    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" rx="1.2" transform="translate(28 50) rotate(45)"/>
                    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" rx="1.2" transform="translate(50 72) rotate(45)"/>
                </g>
                <circle cx="50" cy="46" r="18" fill="#FBFBF6" stroke="#26323F" stroke-width="1.4"/>
                <polyline points="44,34 40,38 44,42 40,46 44,50 40,54 44,58" fill="none"
                          stroke="#CE3B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="56,34 60,38 56,42 60,46 56,50 60,54 56,58" fill="none"
                          stroke="#CE3B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h1>DIAMOND<span class="colon">:</span>CONTEXT</h1>
        </a>
        <div class="live-indicator" aria-label="Live">
            <span class="dot"></span><span class="label">LIVE</span>
        </div>
    </header>

    <main id="board" class="board"></main>
    <main id="game-view" class="game-view" hidden></main>
    <main id="standings-view" class="standings-view" hidden></main>
    <main id="leaders-view" class="leaders-view" hidden></main>
    <main id="mvp-view" class="mvp-view" hidden></main>
    <main id="about-view" class="about-view" hidden></main>
    <main id="player-view" class="player-view" hidden></main>
    <main id="markets-view" class="markets-view" hidden></main>
    <main id="watch-view" class="watch-view" hidden></main>
    <main id="team-view" class="team-view" hidden></main>
    <main id="track-record-view" class="page-view" hidden></main>
    <main id="how-it-works-view" class="page-view" hidden></main>

    <nav aria-label="sections">
        <a href="#live" class="nav-item active" data-route="live"><span class="num">01</span> LIVE</a>
        <a href="#markets" class="nav-item" data-route="markets"><span class="num">02</span> MARKETS</a>
        <a href="#standings" class="nav-item" data-route="standings"><span class="num">03</span> STANDINGS</a>
        <a href="#leaders" class="nav-item" data-route="leaders"><span class="num">04</span> LEADERS</a>
        <a href="#watch" class="nav-item" data-route="watch"><span class="num">05</span> WATCH</a>
    </nav>

    <footer class="page-footer">
        <span class="data-credit">
            Live feed: <a href="https://statsapi.mlb.com" target="_blank" rel="noopener">MLB Stats API</a>
            · Historical play-by-play: <a href="https://www.retrosheet.org" target="_blank" rel="noopener">Retrosheet</a>
        </span>
        <span class="model-accuracy" id="footer-accuracy" hidden></span>
        <span class="build-meta">
            <a href="#game/demo" title="Synthetic high-leverage scenario for testing the live UI">Demo</a>
            <a href="#track-record" title="Bot performance — fires, hit rate, ROI">Track record</a>
            <a href="#how-it-works" title="Empirical methodology — every coefficient derived from data">How it works</a>
            <a href="#about">About</a>
            <a href="https://github.com/hroessner22/Baseball-stats" target="_blank" rel="noopener">Source</a>
            <span class="version">v1.0</span>
        </span>
    </footer>

    <script src="parks.js"></script>
    <!-- 3D ballpark model (WebGL/Three.js). Module — imports three from CDN.
         app.js calls window.Field3D.* (queued until this loads). -->
    <script type="module" src="field3d.js?v=20260616FIELD3DV2"></script>
    <script src="kalshi.js?v=20260615CLIENTPROPS"></script>
    <script src="health.js?v=20260609WEFALL"></script>
    <script src="app.js?v=20260616COLLAPSE"></script>
    <!-- Loaded as a module so it can import @supabase/supabase-js
         from the ESM CDN. Exposes window.Auth for any non-module
         caller that wants to gate behavior on sign-in state. -->
    <script type="module" src="auth.js"></script>
    <!-- Bot scoring framework — multi-factor scoring of buy / cash-out
         decisions. Exposes window.BotScoring; loaded BEFORE autobot.js
         so the bot can call scoreBet() / logScoredDecision().
         Query-string version pins Cloudflare cache so a fresh deploy
         doesn't serve stale JS from CDN edge. */ -->
    <script src="bot-scoring.js?v=20260609WEFALL"></script>
    <!-- Notifications log — surfaces only what the bot can't fix
         on its own (stuck position, auth loss, balance empty, daily
         loss limit). Must load BEFORE autobot.js so the bot can
         push to it from any failure path. -->
    <script src="bot-notifications.js?v=20260609WEFALL"></script>
    <!-- AutoBot: edge-detection bot + Open Bets drawer. Loads last
         so it can read window.Kalshi (must already be initialized). -->
    <script src="autobot.js?v=20260616MLMODEL"></script>
    <!-- Active Bets strip: slim bottom widget showing every active
         position with deep-links + DraftKings-style progress bars
         on player props. Reads window.Kalshi and the bot fires log. -->
    <script src="active-bets-strip.js?v=20260609WEFALL"></script>
    <!-- Persistent Watch widget: always-on launcher (bottom-right) that
         hands the featured game to the Watch extension for corner PiP.
         Present on every page so watching is one click from anywhere. -->
    <script src="watch-widget.js?v=20260616ALLPIP"></script>
</body>
</html>
