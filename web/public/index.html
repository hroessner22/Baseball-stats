<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1220">
    <meta name="description" content="DIAMOND:CONTEXT — every MLB game in progress, each led by an empirical win probability drawn from 150 years of history.">
    <title>DIAMOND:CONTEXT — Live Baseball Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DIAMOND<span class="colon">:</span>CONTEXT</h1>
        <div class="live-indicator" aria-label="Live">
            <span class="dot"></span><span class="label">LIVE</span>
        </div>
    </header>

    <main id="board" class="board"></main>
    <main id="game-view" class="game-view" hidden></main>
    <main id="hot-view" class="hot-view" hidden></main>
    <main id="standings-view" class="standings-view" hidden></main>
    <main id="leaders-view" class="leaders-view" hidden></main>
    <main id="mvp-view" class="mvp-view" hidden></main>
    <main id="about-view" class="about-view" hidden></main>
    <main id="player-view" class="player-view" hidden></main>
    <main id="markets-view" class="markets-view" hidden></main>
    <main id="team-view" class="team-view" hidden></main>

    <nav aria-label="sections">
        <a href="#live" class="nav-item active" data-route="live"><span class="num">01</span> LIVE</a>
        <a href="#hot" class="nav-item" data-route="hot"><span class="num">02</span> HOT</a>
        <a href="#markets" class="nav-item" data-route="markets"><span class="num">03</span> MARKETS</a>
        <a href="#standings" class="nav-item" data-route="standings"><span class="num">04</span> STANDINGS</a>
        <a href="#leaders" class="nav-item" data-route="leaders"><span class="num">05</span> LEADERS</a>
        <a href="#mvp" class="nav-item" data-route="mvp"><span class="num">06</span> MVP</a>
    </nav>

    <footer class="page-footer">
        <span class="data-credit">
            Live feed: <a href="https://statsapi.mlb.com" target="_blank" rel="noopener">MLB Stats API</a>
            · Historical play-by-play: <a href="https://www.retrosheet.org" target="_blank" rel="noopener">Retrosheet</a>
        </span>
        <span class="model-accuracy" id="footer-accuracy" hidden></span>
        <span class="build-meta">
            <a href="#game/demo" title="Synthetic high-leverage scenario for testing the live UI">Demo</a>
            <a href="#about">How it works</a>
            <a href="https://github.com/hroessner22/Baseball-stats" target="_blank" rel="noopener">Source</a>
            <span class="version">v1.0</span>
        </span>
    </footer>

    <script src="parks.js"></script>
    <script src="kalshi.js"></script>
    <script src="health.js"></script>
    <script src="app.js"></script>
    <!-- Loaded as a module so it can import @supabase/supabase-js
         from the ESM CDN. Exposes window.Auth for any non-module
         caller that wants to gate behavior on sign-in state. -->
    <script type="module" src="auth.js"></script>
    <!-- AutoBot: edge-detection bot + Open Bets drawer. Loads last
         so it can read window.Kalshi (must already be initialized). -->
    <script src="autobot.js"></script>
    <!-- Active Bets strip: slim bottom widget showing every active
         position with deep-links + DraftKings-style progress bars
         on player props. Reads window.Kalshi and the bot fires log. -->
    <script src="active-bets-strip.js"></script>
</body>
</html>
