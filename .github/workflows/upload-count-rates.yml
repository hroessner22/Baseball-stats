name: Upload per-count rate tables

# One-off (or rebuild-time) workflow that ships the gzipped per-count
# CSVs into the batter_rates_by_count / pitcher_rates_by_count Supabase
# tables. Uses the same SUPABASE_SERVICE_KEY secret as the daily ingest.
#
# Trigger manually from the Actions tab. Idempotent — the upload script
# uses Prefer: resolution=merge-duplicates so existing rows get their
# `n` overwritten rather than colliding on the PK.

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: pip install --quiet certifi

      - name: Upload per-count rates
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.upload_rates_by_count
